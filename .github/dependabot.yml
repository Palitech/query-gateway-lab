version: 2
updates:
  # Python packages, read from pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a few days after a release before proposing it, so a broken or
    # malicious release has time to be noticed and pulled. Security updates
    # ignore this and arrive at once.
    cooldown:
      default-days: 7
    # One PR for all minor and patch updates. Major updates stay as
    # separate PRs because they are the ones that can break things.
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions used in .github/workflows. Updates both the SHA and the tag comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
