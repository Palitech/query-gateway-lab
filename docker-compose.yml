services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      # From 18 on, the image's data lives under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level up at /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      # Scripts here run only on first start, when the data volume is empty.
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
